# much of this is taken from the Empress main.yml file
name: BIRDMAn CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
    branches:
      - main
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: birdman
          miniforge-version: latest
          channels: conda-forge
          channel-priority: true
          python-version: ${{ matrix.python-version }}

      - name: Install conda packages
        shell: bash -l {0}
        run: mamba install -c conda-forge biom-format patsy pytest xarray scikit-bio flake8 "arviz<1" cmdstanpy pytest-cov

      - name: Install BIRDMAn
        shell: bash -l {0}
        run: pip install -e .[dev]

      - name: Check style
        shell: bash -l {0}
        run: make stylecheck

      - name: Run tests
        shell: bash -l {0}
        run: make pytest

      - name: Install into a bare virtualenv and import
        shell: bash -l {0}
        run: |
          python -m venv "${RUNNER_TEMP}/clean"
          "${RUNNER_TEMP}/clean/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/clean/bin/python" -m pip install .
          "${RUNNER_TEMP}/clean/bin/python" -c "import birdman; print(birdman.__version__)"
